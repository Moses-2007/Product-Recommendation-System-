<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- SEO Best Practices -->
    <title>HomeRecommend - Premium Smart Home Appliances Store</title>
    <meta name="description" content="Discover and shop premium smart home appliances. Get real-time content-based product recommendations matching your text descriptions, browse top brands, and checkout securely." />

  <body>
    <div id="app">
      <!-- Sticky Navigation Header -->
      <header class="app-header" id="app-header-nav"></header>

      <!-- Slide-Over Cart Drawer Components -->

      <!-- Footer Area -->

        <div style="max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 0.5rem;">
          <div>&copy; 2026 <strong>HomeRecommend System</strong>. Built with a Content-Based Filtering Vector Engine.</div>
          <div style="font-size: 0.75rem;">Shop Owner Product approval required. Cosine text similarity calculated instantly on client descriptions.</div>
        </div>
      </footer>
    </div>
    
    <!-- Main Application Router Entry -->
    <script type="module" src="/src/main.js"></script>
